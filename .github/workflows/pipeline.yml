name: Weekly Pipeline Run

on:
  schedule:
    # Runs at 02:00 UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force_full_run:
        description: 'Force full re-discovery run'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  run-pipeline:
    name: Execute Discovery & Catalog Update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Full Pipeline Runner
        run: pnpm run pipeline:run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_RUN: ${{ inputs.force_full_run }}

      - name: Commit & Push Catalog Changes
        id: commit_step
        run: |
          if [ -n "$(git status --porcelain content/ data/)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add content/ data/
            git commit -m "chore(catalog): weekly catalog refresh"
            git push origin main
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No catalog changes detected this run."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.commit_step.outputs.has_changes == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Astro Site & Pagefind Search Index
        if: steps.commit_step.outputs.has_changes == 'true'
        run: pnpm run site:build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages Artifact
        if: steps.commit_step.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/site/dist'

      - name: Deploy to GitHub Pages
        if: steps.commit_step.outputs.has_changes == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
